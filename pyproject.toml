[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "match-analyst"
version = "0.6.0"
description = "Local football match analysis using StatsBomb Open Data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "mplsoccer>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
